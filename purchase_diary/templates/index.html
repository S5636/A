<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1c">
<title>구매 다이어리</title>
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app-shell">

  <header class="app-header">
    <div class="app-title">
      <h1>🛒 구매 다이어리</h1>
    </div>
    <button class="btn" id="btn-add-item">+ 새 품목</button>
  </header>

  <div class="grid-row" id="kpi-row"></div>

  <div class="card" style="margin-top:16px;">
    <div class="card-title"><span class="dot"></span>품목별 구매 현황</div>
    <div class="hint">품목을 추가하고, 살 때마다 "구매 기록 추가"로 날짜·가격을 입력하세요. 2번째 구매부터 구매 간격과 가격 변화가 자동으로 계산됩니다.</div>
    <div class="item-grid" id="item-grid"></div>
    <div class="empty-hint" id="empty-hint" style="display:none;">아직 등록된 품목이 없어요. 오른쪽 위 "+ 새 품목"으로 시작하세요.</div>
  </div>

</div>

<!-- 새 품목 모달 -->
<div class="modal-backdrop" id="modal-add-item">
  <div class="modal">
    <div class="modal-title">새 품목 추가</div>
    <input class="text-input" id="input-item-name" placeholder="품목명 (예: 3겹 화장지 30롤)">
    <input class="text-input" id="input-item-category" placeholder="카테고리 (선택, 예: 생필품)">
    <div class="modal-actions">
      <button class="btn secondary" id="btn-cancel-item">취소</button>
      <button class="btn" id="btn-save-item">추가</button>
    </div>
  </div>
</div>

<!-- 구매 기록 추가 모달 -->
<div class="modal-backdrop" id="modal-add-purchase">
  <div class="modal">
    <div class="modal-title" id="purchase-modal-title">구매 기록 추가</div>
    <label class="field-label">구매일</label>
    <input class="text-input" id="input-purchase-date" type="date">
    <label class="field-label">가격 (원)</label>
    <input class="text-input" id="input-purchase-price" type="number" placeholder="예: 15900">
    <label class="field-label">수량/용량 (선택)</label>
    <input class="text-input" id="input-purchase-qty" placeholder="예: 30롤 1팩">
    <label class="field-label">구매처 (선택)</label>
    <input class="text-input" id="input-purchase-store" placeholder="예: 쿠팡, 마트 등 - 직접 입력">
    <div class="modal-actions">
      <button class="btn secondary" id="btn-cancel-purchase">취소</button>
      <button class="btn" id="btn-save-purchase">저장</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
