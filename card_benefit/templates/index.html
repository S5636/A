<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>카드 남은혜택 체크</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="topbar">
  <h1>💳 카드 남은혜택 체크</h1>
  <button id="btn-add-card" class="btn btn-primary">+ 카드 추가</button>
</header>

<main id="card-list" class="card-list">
  <p class="empty-hint" id="empty-hint">아직 등록된 카드가 없습니다. "카드 추가"를 눌러 시작하세요.</p>
</main>

<!-- 카드 추가/수정 모달 -->
<div class="modal-backdrop" id="card-modal">
  <div class="modal">
    <h2 id="card-modal-title">카드 추가</h2>
    <label>카드 이름
      <input type="text" id="card-name" placeholder="예: 신한 Deep Dream">
    </label>
    <label>카드사 (선택)
      <input type="text" id="card-issuer" placeholder="예: 신한카드">
    </label>
    <label>혜택 초기화 기준일
      <input type="number" id="card-reset-day" min="1" max="31" value="1">
      <small>매달 이 날짜에 혜택 사용량이 리셋됩니다. (결제일 기준이면 결제일 입력)</small>
    </label>
    <label>메모 (선택)
      <textarea id="card-memo" rows="2" placeholder="전월실적 조건 등"></textarea>
    </label>
    <div class="modal-actions">
      <button class="btn" id="card-cancel">취소</button>
      <button class="btn btn-primary" id="card-save">저장</button>
    </div>
  </div>
</div>

<!-- 혜택 추가/수정 모달 -->
<div class="modal-backdrop" id="benefit-modal">
  <div class="modal">
    <h2 id="benefit-modal-title">혜택 추가</h2>
    <label>혜택 이름
      <input type="text" id="benefit-name" placeholder="예: 스타벅스 30% 할인">
    </label>
    <label>한도 종류
      <select id="benefit-type">
        <option value="amount">금액 (원)</option>
        <option value="count">횟수 (회)</option>
      </select>
    </label>
    <label>월 한도
      <input type="number" id="benefit-limit" min="0" step="1" placeholder="예: 10000">
    </label>
    <label>메모 (선택)
      <textarea id="benefit-memo" rows="2" placeholder="적용 조건 등"></textarea>
    </label>
    <div class="modal-actions">
      <button class="btn" id="benefit-cancel">취소</button>
      <button class="btn btn-primary" id="benefit-save">저장</button>
    </div>
  </div>
</div>

<!-- 사용 기록 모달 -->
<div class="modal-backdrop" id="use-modal">
  <div class="modal">
    <h2>혜택 사용 기록</h2>
    <label id="use-value-label">사용 금액 (원)
      <input type="number" id="use-value" min="0" step="1">
    </label>
    <label>사용 날짜
      <input type="date" id="use-date">
    </label>
    <label>메모 (선택)
      <input type="text" id="use-memo" placeholder="예: 강남점 결제">
    </label>
    <div class="modal-actions">
      <button class="btn" id="use-cancel">취소</button>
      <button class="btn btn-primary" id="use-save">기록</button>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
