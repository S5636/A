<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>COREBOX</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/icon-192.png') }}?v={{ asset_version }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}?v={{ asset_version }}">
  <meta name="theme-color" content="#0a0f1c">
  <link href="https://webfontworld.github.io/nanum/NanumSquareRound.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ asset_version }}">
</head>
<body data-asset-version="{{ asset_version }}">
  <div class="app-shell">
    <div class="app-header">
      <div class="app-title">
        <img src="{{ url_for('static', filename='img/logo.png') }}?v={{ asset_version }}" class="app-logo" alt="">
        <img src="{{ url_for('static', filename='img/wordmark.png') }}?v={{ asset_version }}" class="app-wordmark" alt="COREBOX">
        <span class="app-subtitle">서류 보관함</span>
      </div>
    </div>

    <div class="main-tabs">
      <button class="main-tab active" id="tab-btn-documents" type="button">서류</button>
      <button class="main-tab" id="tab-btn-salary" type="button">급여</button>
    </div>

    <div id="documents-tab">
      <div class="header-actions">
        <label class="btn small" for="auto-upload-image" style="margin:0;">📷 사진 올리기</label>
        <input type="file" id="auto-upload-image" accept="image/*" multiple style="display:none;">
        <label class="btn small" for="auto-upload-pdf" style="margin:0;">📄 PDF 올리기</label>
        <input type="file" id="auto-upload-pdf" accept="application/pdf" multiple style="display:none;">
        <button class="btn secondary small" id="btn-add-doc">+ 직접 입력</button>
      </div>
      <div id="auto-upload-log"></div>

      <div class="section-title">연도별 집계</div>
      <div id="aggregate-area"></div>

      <div class="section-title">서류 목록</div>
      <div id="documents-area"></div>
    </div>

    <div id="salary-tab" style="display:none;">
      <div class="header-actions">
        <label>연도 <input type="number" id="salary-upload-year" step="1" style="width:56px;"></label>
        <select id="salary-upload-month" style="width:52px;"></select>
        <label class="btn small" for="salary-upload-file" style="margin:0;">📄 올리기</label>
        <input type="file" id="salary-upload-file" accept="image/*,application/pdf" multiple style="display:none;">
        <button class="btn secondary small" id="btn-add-salary">+ 입력</button>
      </div>
      <div id="salary-upload-log"></div>

      <div class="section-title">
        <button class="icon-btn" id="salary-year-prev" title="이전 연도">◀</button>
        <span id="salary-year-label">급여</span>
        <button class="icon-btn" id="salary-year-next" title="다음 연도">▶</button>
      </div>
      <div id="salary-table-area"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="doc-modal">
    <div class="modal">
      <h3 id="doc-modal-title">서류 추가</h3>
      <label>서류명
        <input type="text" id="doc-name" placeholder="예: 2020 소득금액증명">
      </label>
      <label>분류 (선택, 자유 입력)
        <input type="text" id="doc-category" placeholder="예: 세금, 사업자 서류, 통장">
      </label>
      <label>연도 (선택)
        <input type="number" id="doc-year" min="2000" max="2100" step="1" placeholder="예: 2020">
      </label>
      <label>집계용 문서 종류 (선택 - 적으면 연도별 집계표에 합산됨)
        <input type="text" id="doc-type" placeholder="예: 소득금액증명">
      </label>
      <label>발급일 (선택 - 제출 유효기간 확인용, 보통 한 달)
        <input type="date" id="doc-issue-date">
      </label>
      <label>기간 (선택, 자유 입력 - 과세기간 등)
        <input type="text" id="doc-period" placeholder="예: 2022-01-01~2022-06-30">
      </label>
      <label>목록에 보일 짧은 이름 (선택, 예: "2025년 1기")
        <input type="text" id="doc-period-label" placeholder="예: 2025년 1기">
      </label>
      <label id="doc-income-row">수입금액
        <input type="number" id="doc-income" min="0" step="1" placeholder="예: 48956333">
      </label>
      <label id="doc-taxable-row">소득금액
        <input type="number" id="doc-taxable" step="1" placeholder="예: 33323540">
      </label>
      <label id="doc-income-business-row">사업수입
        <input type="number" id="doc-income-business" step="1" placeholder="예: 72934754">
      </label>
      <label id="doc-income-wage-row">근로수입
        <input type="number" id="doc-income-wage" step="1" placeholder="예: 27190718">
      </label>
      <label id="doc-income-other-row">기타수입
        <input type="number" id="doc-income-other" step="1" placeholder="예: 0">
      </label>
      <label id="doc-taxable-business-row">사업소득
        <input type="number" id="doc-taxable-business" step="1" placeholder="예: -683983">
      </label>
      <label id="doc-taxable-wage-row">근로소득
        <input type="number" id="doc-taxable-wage" step="1" placeholder="예: 17862111">
      </label>
      <label id="doc-taxable-other-row">기타소득
        <input type="number" id="doc-taxable-other" step="1" placeholder="예: 0">
      </label>
      <label id="doc-amount-row">과세표준액
        <input type="number" id="doc-amount" step="1" placeholder="예: 150000000">
      </label>
      <label id="doc-tax-amount-row">세액 (환급이면 음수)
        <input type="number" id="doc-tax-amount" step="1" placeholder="예: -324723">
      </label>
      <label>파일 (선택 - 비워두면 기존 파일 유지)
        <input type="file" id="doc-file">
      </label>
      <label>메모 (선택)
        <input type="text" id="doc-memo" placeholder="특이사항 등">
      </label>
      <div class="modal-actions">
        <button class="btn secondary" id="doc-cancel">취소</button>
        <button class="btn primary" id="doc-save">저장</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="salary-modal">
    <div class="modal">
      <h3 id="salary-modal-title">급여 추가</h3>
      <label>연도
        <input type="number" id="salary-year" step="1">
      </label>
      <label>월
        <select id="salary-month"></select>
      </label>
      <label>실지급액
        <input type="number" id="salary-net-pay" step="1" placeholder="예: 3442780">
      </label>
      <label>지급 소계
        <input type="number" id="salary-gross-pay" step="1" placeholder="예: 4000000">
      </label>
      <label>공제 소계
        <input type="number" id="salary-total-deduction" step="1" placeholder="예: 557220">
      </label>
      <label>기본급
        <input type="number" id="salary-base-pay" step="1">
      </label>
      <label>연장수당
        <input type="number" id="salary-overtime-pay" step="1">
      </label>
      <label>직책수당
        <input type="number" id="salary-position-pay" step="1">
      </label>
      <label>야근수당
        <input type="number" id="salary-night-pay" step="1">
      </label>
      <label>기타(지급)
        <input type="number" id="salary-other-pay" step="1">
      </label>
      <label>갑근세
        <input type="number" id="salary-income-tax" step="1">
      </label>
      <label>주민세
        <input type="number" id="salary-local-tax" step="1">
      </label>
      <label>국민연금
        <input type="number" id="salary-national-pension" step="1">
      </label>
      <label>건강보험
        <input type="number" id="salary-health-insurance" step="1">
      </label>
      <label>고용보험
        <input type="number" id="salary-employment-insurance" step="1">
      </label>
      <label>학자금대출상환
        <input type="number" id="salary-loan-repayment" step="1">
      </label>
      <label>파일 (선택 - 비워두면 기존 파일 유지)
        <input type="file" id="salary-file">
      </label>
      <label>메모 (선택)
        <input type="text" id="salary-memo">
      </label>
      <div class="modal-actions">
        <button class="btn secondary" id="salary-cancel">취소</button>
        <button class="btn primary" id="salary-save">저장</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}?v={{ asset_version }}"></script>
</body>
</html>
